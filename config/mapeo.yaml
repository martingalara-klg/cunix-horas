  lzalazar:
    nombre: "Lautaro Zalazar"
    archivo: "L Zalazar"
    mail: "lautaro.zalazar@cunix.net"

  # Alexis tambien exporto con el resumen mensual. Usuario y mail confirmados
  # por el dueno el 2026-09-28.
  acarnero:
    nombre: "Alexis Carnero"
    archivo: "Carnero"
    mail: "alexis.carnero@cunix.net"

proyectos:
  CO2610170:
    cliente: "Servicio Nacional de Aduanas"
    proyecto: "Subastas"
    numero_proyecto: "CO2610170"
  CO2510115:
    cliente: "Instituto de Salud Pública de Chile"
    proyecto: "SIAC-OIRS"
    numero_proyecto: "CO2510115"
  PR2510126:
    cliente: "MINVU"
    proyecto: "SELICO"
    numero_proyecto: "PR2510126"
  AD2690002:
    cliente: "Sistemas - C.UNIX"
    proyecto: "VictoriusCP2"
    # El caso que muestra que el Project number NO es el codigo del corchete.
    numero_proyecto: "210"
  GI2680001:
    cliente: "Sistemas - C.UNIX"
    proyecto: "Victorius 3"
    # PROVISORIO. Kimai no expone el Project number de este proyecto en el
    # resumen mensual, y el dueno decidio el 2026-09-28 usar aca el codigo del
    # corchete, que es un identificador real de Kimai para el mismo proyecto,
    # en vez de dejar la columna vacia o inventar un texto.
    # Cuando aparezca el Project number verdadero (ficha del proyecto en Kimai,
    # o cualquier export de detalle de Lautaro), reemplazar el valor de abajo.
    numero_proyecto: "GI2680001"
