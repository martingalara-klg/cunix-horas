# Con esto, los dos archivos de resumen mensual de input/2026-08/ quedan
# afuera y el consolidado sale marcado como INCOMPLETO. Los tres que vienen
# del reporte de detalle entran igual.
#
# Vive acá y NO en config/mapeo.yaml: el test prueba el comportamiento del
# programa, no la configuración de producción, que el dueño completa y cambia
# cuando quiere. El mapeo completo equivalente está en
# `mapeo-completo-de-prueba.yaml`.

